<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Product Management{% endblock %}</title>
    <link rel="stylesheet" href="/static/products/style.css">
</head>

<body>

<nav>
    <h2>E-Commerce Product Management System </h2>

    {% if user.is_authenticated %}
        <a href="{% url 'product_list' %}">Products</a>
        <a href="{% url 'product_create' %}">Add Product</a>
        <a href="{% url 'logout' %}">Logout</a>
    {% else %}
        <a href="{% url 'login' %}">Login</a>
        <a href="{% url 'register' %}">Register</a>
    {% endif %}
</nav>

<main>
    {% block content %}
    {% endblock %}
</main>

</body>
</html>
